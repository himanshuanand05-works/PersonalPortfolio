<ui-section-header
  kicker="~/projects"
  title="Some Personal projects"
  lead="Open-source and shipped work spanning LLM-powered assistants, reusable computer-vision tooling, and accessible early-learning experiences — each published where anyone can verify it."
  appReveal
/>

<div class="projects">
  @for (project of projects; track project.id; let i = $index) {
    <article class="project" appReveal [revealDelay]="stagger(i)">
      <div class="project__top">
        <h2 class="project__name">{{ project.name }}</h2>
        <span class="project__status">{{ project.status }}</span>
      </div>
      <p class="project__tagline">{{ project.tagline }}</p>
      <p class="project__desc">{{ project.description }}</p>
      <div class="chips">
        @for (tech of project.stack; track tech) {
          <ui-tag-chip [label]="tech" accent />
        }
      </div>
      @if (project.href) {
        <a
          class="project__link"
          [href]="project.href"
          rel="noopener noreferrer"
          target="_blank"
        >
          <ui-icon name="external" />
          {{ project.hrefLabel }}
        </a>
      }
    </article>
  }
</div>
