<ui-section-header
  kicker="~/skills"
  title="Technical skill matrix"
  lead="Seven years of production experience across backend engineering, distributed systems architecture, cloud delivery, data platforms, frontends and AI integration — grouped the way engineering teams actually staff projects."
/>

<div class="groups">
  @for (group of groups; track group.id) {
    <ui-panel [kicker]="group.id" [title]="group.title">
      <p class="group__blurb">{{ group.blurb }}</p>
      <div class="group__bars">
        @for (skill of group.skills; track skill.name) {
          <ui-skill-bar [name]="skill.name" [level]="skill.level" [note]="skill.note" />
        }
      </div>
    </ui-panel>
  }
</div>

<ui-panel kicker="summary" title="Everything at a glance" wide>
  <p class="summary">
    @for (skill of allSkills; track skill) {
      <span class="summary__item">{{ skill }}</span>
    }
  </p>
</ui-panel>
