<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Himanshu Anand</title>
  <base href="/">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #05070d;
      color: #e8eef9;
      font-family: ui-monospace, 'Cascadia Code', monospace;
      text-align: center;
    }
    .box { max-width: 420px; padding: 24px; }
    h1 { color: #00ff9c; font-size: 1.4rem; letter-spacing: 0.08em; }
    p { color: #9fb0c9; line-height: 1.6; }
    a { color: #00ff9c; }
  </style>
  <script>
    // GitHub Pages serves this for any missing path; route home, preserving sub-path bases.
    (function () {
      var segs = location.pathname.split('/').filter(Boolean);
      // If hosted under a project sub-path (first segment has no dot), keep it as the base.
      var base = segs.length && segs[0].indexOf('.') === -1 ? '/' + segs[0] + '/' : '/';
      var target = location.origin + base;
      document.write('<link rel="canonical" href="' + target + '">');
      window.__home = target;
    })();
  </script>
</head>
<body>
  <div class="box">
    <h1>404 // SIGNAL LOST</h1>
    <p>This route doesn’t exist, but the main systems are all online.</p>
    <p><a id="home-link" href="/">Return to the overview →</a></p>
  </div>
  <script>
    document.getElementById('home-link').href = window.__home || '/';
  </script>
</body>
</html>
