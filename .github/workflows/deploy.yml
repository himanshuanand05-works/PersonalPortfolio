name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AEO assets + static site
        # For a *user/organization* site (repo named <user>.github.io) or a custom
        # domain, use: npm run build   (base href "/").
        # For a project site, keep --base-href=/PersonalPortfolio/ matching the repo name.
        run: npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Enables Pages automatically if it is not enabled yet. Requires admin
          # access to the repository; if it fails, enable it manually in
          # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
